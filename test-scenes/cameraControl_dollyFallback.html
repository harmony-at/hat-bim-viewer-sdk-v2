<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CameraControl dolly fallback</title>
</head>
<body>
<script type="module">
import {CameraUpdater} from "../src/viewer/scene/CameraControl/lib/CameraUpdater.js";
import {signalTestComplete} from "./lib/utils.js";

function createHarness({
    pickedWorldPos = null,
    firstPerson = false,
    planView = false,
    wheelContext = false,
    dolliedThroughSurface = false
} = {}) {
    let tick;
    const zoomCalls = [];
    const panCalls = [];
    let zoomAnchorCrossedCount = 0;

    const camera = {
        eye: [0, 0, 6000],
        look: [0, 0, 0],
        up: [0, 1, 0],
        projection: "perspective",
        ortho: {scale: 1},
        get eyeLookDist() {
            const dx = this.eye[0] - this.look[0];
            const dy = this.eye[1] - this.look[1];
            const dz = this.eye[2] - this.look[2];
            return Math.sqrt(dx * dx + dy * dy + dz * dz);
        },
        zoom(delta) {
            zoomCalls.push(delta);
            this.eye[2] += delta;
        },
        pan() {},
        pitch() {},
        yaw() {}
    };

    const scene = {
        camera,
        on(event, callback) {
            if (event === "tick") {
                tick = callback;
            }
            return "tick-subscription";
        },
        off() {}
    };

    const pickController = {
        pickCursorPos: null,
        schedulePickSurface: false,
        pickResult: null,
        update() {
            this.pickResult = pickedWorldPos ? {worldPos: pickedWorldPos} : null;
        },
        fireEvents() {}
    };

    const panController = {
        dollyToCanvasPos(worldPos, canvasPos, amount) {
            panCalls.push({worldPos, canvasPos, amount});
            return dolliedThroughSurface;
        }
    };

    const pivotController = {
        getPivoting() {
            return false;
        },
        continuePivot() {},
        showPivot() {}
    };

    const cameraControl = {
        _cursors: {
            rotate: "grabbing",
            pan: "move",
            dollyForward: "zoom-in",
            dollyBackward: "zoom-out"
        }
    };

    const controllers = {
        pickController,
        panController,
        pivotController,
        cameraControl,
        navigationContextController: {
            beginOrContinueZoom() {
                return {
                    worldPos: pickedWorldPos || [0, 0, 0],
                    canvasPos: [10, 10],
                    source: pickedWorldPos ? "cursor-hit" : "camera-forward"
                };
            },
            markZoomAnchorCrossed() {
                zoomAnchorCrossedCount++;
            },
            translateNavigationPivot() {}
        }
    };

    const configs = {
        active: true,
        pointerEnabled: true,
        followPointer: true,
        firstPerson,
        planView,
        constrainVertical: false,
        dollyProximityThreshold: 30,
        dollyMinSpeed: 0.04,
        dollyInertia: 0,
        rotationInertia: 0,
        panInertia: 0
    };

    const states = {
        followPointerDirty: true,
        pointerCanvasPos: [10, 10]
    };

    const updates = {
        rotateDeltaX: 0,
        rotateDeltaY: 0,
        panDeltaX: 0,
        panDeltaY: 0,
        panDeltaZ: 0,
        dollyDelta: 0
    };

    if (wheelContext) {
        updates.dollyTimestamp = 0;
        updates.dollyCanvasPos = [10, 10];
        updates.dollyInputSource = "wheel";
    }

    new CameraUpdater(
        scene,
        controllers,
        configs,
        states,
        updates
    );

    function runStep() {
        const beforeDistance = camera.eyeLookDist;
        const zoomStart = zoomCalls.length;
        const panStart = panCalls.length;
        const crossedStart = zoomAnchorCrossedCount;
        updates.dollyDelta = -1;
        tick();
        return {
            beforeDistance,
            afterDistance: camera.eyeLookDist,
            zoomCalls: zoomCalls.slice(zoomStart),
            panCalls: panCalls.slice(panStart),
            followPointerDirty: states.followPointerDirty,
            zoomAnchorCrossedCount: zoomAnchorCrossedCount - crossedStart
        };
    }

    return {runStep};
}

window.runDollyScenario = (options = {}) => {
    const harness = createHarness(options);
    const steps = [];
    const stepCount = options.steps || 1;
    for (let i = 0; i < stepCount; i++) {
        steps.push(harness.runStep());
    }
    return {steps};
};

signalTestComplete();
</script>
</body>
</html>
